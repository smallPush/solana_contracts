entity.contract.add_form:
  path: '/contract/add'
  defaults:
    _entity_form: 'contract.add'
    _title: 'Add contract'
  requirements:
    _permission: 'create contract entities'

entity.contract.edit_form:
  path: '/contract/{contract}/edit'
  defaults:
    _entity_form: 'contract.edit'
    _title: 'Edit Contract'
  requirements:
    _entity_access: 'contract.update'

entity.contract.delete_form:
  path: '/contract/{contract}/delete'
  defaults:
    _entity_form: 'contract.delete'
    _title: 'Delete Contract'
  requirements:
    _entity_access: 'contract.delete'

entity.contract.canonical:
  path: '/contract/{contract}'
  defaults:
    _entity_view: 'contract.full'
    _title_callback: '\Drupal\Core\Entity\Controller\EntityController::title'
  requirements:
    _entity_access: 'contract.view'

entity.contract.collection:
  path: '/contract/list'
  defaults:
    _entity_list: 'contract'
    _title: 'Contracts'
  requirements:
    _permission: 'view own contract entities'

solana_contracts.sign_form:
  path: '/contract/{contract}/sign'
  defaults:
    _form: '\Drupal\solana_contracts\Form\SignForm'
    _title: 'Sign Contract'
  requirements:
    _entity_access: 'contract.sign'

solana_contracts.save_signature:
  path: '/contract/{contract}/signature'
  defaults:
    _controller: '\Drupal\solana_contracts\Controller\SignatureController::save'
  requirements:
    _entity_access: 'contract.sign'
  methods: [POST]

solana_contracts.reject_signature:
  path: '/contract/{contract}/reject'
  defaults:
    _controller: '\Drupal\solana_contracts\Controller\SignatureController::reject'
  requirements:
    _entity_access: 'contract.sign'
  methods: [POST]

solana_contracts.admin_dashboard:
  path: '/admin/contracts'
  defaults:
    _controller: '\Drupal\solana_contracts\Controller\AdminController::dashboard'
    _title: 'Contracts Dashboard'
  requirements:
    _permission: 'administer contract entities'

solana_contracts.api.contracts:
  path: '/api/contracts'
  defaults:
    _controller: '\Drupal\solana_contracts\Controller\ApiController::getContracts'
  requirements:
    _permission: 'administer contract entities'
